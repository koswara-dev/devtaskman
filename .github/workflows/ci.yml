name: CI/CD - Build, Push & Deploy

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_API_URL=http://devtaskman.local
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, k3s]
    environment: production
    steps:
      - name: Extract version tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull newly built images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ steps.vars.outputs.tag }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ steps.vars.outputs.tag }}

      - name: Import images into k3s containerd
        run: |
          docker save ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ steps.vars.outputs.tag }} | sudo k3s ctr images import -
          docker save ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ steps.vars.outputs.tag }} | sudo k3s ctr images import -

      - name: Deploy to k3s
        env:
          KUBECONFIG: /home/devops/.kube/config
        run: |
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ steps.vars.outputs.tag }}
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ steps.vars.outputs.tag }}
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
